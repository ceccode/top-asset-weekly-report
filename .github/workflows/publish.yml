name: Generate Reports and Publish to GitHub Pages

on:
  schedule:
    # Run every Monday at 07:00 UTC
    - cron: '0 7 * * 1'
  workflow_dispatch:
    # Allow manual trigger

# Allow only one concurrent deployment
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # Allow bot to commit reports
      pages: read      # Needed by configure-pages
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      
      - name: Run tests
        run: python -m pytest tests -q
      
      - name: Generate reports
        env:
          # Without this secret the editorial sections fall back to placeholders
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        # Exits non-zero unless every report was generated, which stops the
        # steps below: nothing is committed or deployed from a partial run
        run: python main.py --only all --publish
      
      - name: Commit and push reports to repository
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add data/
          git diff --staged --quiet || git commit -m "chore: weekly reports update $(date +'%Y-%m-%d')"
          git push
      
      - name: Setup Pages
        uses: actions/configure-pages@v4
      
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'public'

  # A separate job: deploying in the same job as the upload sometimes ran
  # before the artifact was listed, and failed with "No artifacts found"
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
